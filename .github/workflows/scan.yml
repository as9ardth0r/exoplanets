name: Scan exoplanetes (multi-secteurs, détection automatique)

# Aucune liste de secteurs à maintenir à la main : le premier job
# repère tout seul les fichiers all_targets_S<N>_v1.csv présents à la
# racine du dépôt, et le second en fait une matrice -- ajoute ou
# retire un fichier de cibles, le nombre de secteurs scannés suit
# automatiquement au prochain run.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  detect-secteurs:
    runs-on: ubuntu-latest
    outputs:
      secteurs: ${{ steps.detect.outputs.secteurs }}
    steps:
      - uses: actions/checkout@v5

      - id: detect
        run: |
          SECTEURS=$(ls all_targets_S*_v1.csv 2>/dev/null \
            | sed -E 's/all_targets_S([0-9]+)_v1\.csv/\1/' \
            | sort -n \
            | jq -R -s -c 'split("\n")[:-1] | map(tonumber)')
          echo "secteurs=$SECTEURS" >> "$GITHUB_OUTPUT"
          echo "Secteurs détectés : $SECTEURS"

  scan:
    needs: detect-secteurs
    strategy:
      fail-fast: false   # un secteur qui plante n'arrête pas les autres
      max-parallel: 10    # nombre de secteurs traités en même temps -- ajustable
      matrix:
        secteur: ${{ fromJson(needs.detect-secteurs.outputs.secteurs) }}
    concurrency:
      group: scan-secteur-${{ matrix.secteur }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install lightkurve pandas astropy astroquery pillow

      - name: Lancer le scan du secteur ${{ matrix.secteur }}
        run: >
          timeout 350m python3 exoplanet_bls_count.py
          all_targets_S${{ matrix.secteur }}_v1.csv
          --limit 13000
          --output resultats_S${{ matrix.secteur }}.csv
          || true

      - name: Sauvegarder (fichiers séparés par secteur, pas de conflit possible entre jobs)
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          for i in 1 2 3; do
            git pull --rebase origin main && break
            sleep $((RANDOM % 20 + 5))
          done
          git add resultats_S${{ matrix.secteur }}.csv
          git diff --staged --quiet || git commit -m "Secteur ${{ matrix.secteur }} : $(wc -l < resultats_S${{ matrix.secteur }}.csv) lignes"
          for i in 1 2 3; do
            git push && break
            git pull --rebase origin main
            sleep $((RANDOM % 20 + 5))
          done
