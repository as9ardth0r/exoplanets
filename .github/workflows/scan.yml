name: Scan exoplanetes (multi-secteurs, telechargement auto)

# Aucun fichier à télécharger ou committer à la main : ce workflow va
# chercher lui-même les listes de cibles manquantes directement sur
# tess.mit.edu, pour chaque secteur de la plage définie ci-dessous.
#
# Pour changer la plage de secteurs scannés, modifie uniquement la
# ligne "seq 1 108" dans le job generer-plage.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generer-plage:
    runs-on: ubuntu-latest
    outputs:
      secteurs: ${{ steps.plage.outputs.secteurs }}
    steps:
      - id: plage
        run: |
          SECTEURS=$(seq 1 108 | jq -R -s -c 'split("\n")[:-1] | map(tonumber)')
          echo "secteurs=$SECTEURS" >> "$GITHUB_OUTPUT"
          echo "Plage : $SECTEURS"

  scan:
    needs: generer-plage
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        secteur: ${{ fromJson(needs.generer-plage.outputs.secteurs) }}
    concurrency:
      group: scan-secteur-${{ matrix.secteur }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install lightkurve pandas astropy astroquery pillow

      - name: Récupérer la liste de cibles du secteur ${{ matrix.secteur }} (si absente)
        run: |
          SECTEUR_PAD=$(printf "%03d" ${{ matrix.secteur }})
          FICHIER="all_targets_S${SECTEUR_PAD}_v1.csv"
          if [ -f "$FICHIER" ]; then
            echo "$FICHIER déjà présent, pas de téléchargement."
          else
            echo "Téléchargement de $FICHIER..."
            curl -sL --fail "https://tess.mit.edu/public/target_lists/2m/${FICHIER}" -o "$FICHIER" \
              || { echo "::error::Échec du téléchargement pour le secteur ${{ matrix.secteur }} (secteur inexistant ou pas encore observé ?)"; exit 0; }
          fi
          echo "FICHIER_CIBLES=$FICHIER" >> "$GITHUB_ENV"

      - name: Lancer le scan du secteur ${{ matrix.secteur }}
        run: |
          if [ ! -s "$FICHIER_CIBLES" ]; then
            echo "Pas de fichier de cibles valide pour ce secteur, on s'arrête ici."
            exit 0
          fi
          timeout 340m python3 exoplanet_bls_count.py "$FICHIER_CIBLES" --limit 13000 --output "resultats_S${{ matrix.secteur }}.csv" || true

      - name: Sauvegarder (fusion par TIC ID, robuste même en cas de chevauchement entre jobs)
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          RESULTAT="resultats_S${{ matrix.secteur }}.csv"

          for i in 1 2 3 4 5; do
            git fetch origin main

            if [ -f "$RESULTAT" ]; then
              cp "$RESULTAT" /tmp/local_scan.csv
              git show origin/main:"$RESULTAT" > /tmp/remote_scan.csv 2>/dev/null || cp /tmp/local_scan.csv /tmp/remote_scan.csv
              python3 fusionner.py /tmp/remote_scan.csv /tmp/local_scan.csv /tmp/merged_scan.csv
            fi

            git reset --hard origin/main

            if [ -f /tmp/merged_scan.csv ]; then
              cp /tmp/merged_scan.csv "$RESULTAT"
              git add "$RESULTAT"
            fi
            git add "$FICHIER_CIBLES" 2>/dev/null || true

            git diff --staged --quiet || git commit -m "Secteur ${{ matrix.secteur }}"

            if git push; then
              echo "Poussé avec succès (tentative $i)"
              break
            fi
            echo "Tentative $i échouée (un autre job a poussé entre-temps) -- nouvel essai..."
            sleep $((RANDOM % 15 + 5))
          done
